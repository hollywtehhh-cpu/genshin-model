<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COC Emote Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background-color: #121212; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; }
    model-viewer { width: 100vw; height: 100vh; flex-grow: 1; }
    .emote-panel {
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; padding: 10px;
      background: rgba(0,0,0,0.7); border-radius: 10px; border: 1px solid #444; z-index: 10;
    }
    button {
      padding: 12px 18px; font-size: 14px; font-weight: bold; cursor: pointer;
      color: white; background: #2a2a2a; border: 2px solid #555; border-radius: 5px;
      transition: all 0.2s ease;
    }
    button:hover { background: #ffcc00; color: #121212; border-color: #ffcc00; }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <model-viewer 
    id="charViewer"
    src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/main/2.0/Fox/glTF-Binary/Fox.glb" 
    alt="3D Character" 
    camera-controls 
    auto-rotate
    shadow-intensity="2"
    exposure="1.2">
  </model-viewer>

  <div class="emote-panel">
    <button onclick="playEmote('Survey', 'happy_sfx.mp3')">Hee Hee!</button>
    <button onclick="playEmote('Walk', 'angry_sfx.mp3')">Grrr!</button>
    <button onclick="playEmote('Run', 'cry_sfx.mp3')">Auuugh!</button>
  </div>

  <script>
    const viewer = document.getElementById('charViewer');
    let currentAudio = null;

    function playEmote(animationName, soundFile) {
      viewer.animationName = animationName;
      if (currentAudio) { currentAudio.pause(); }
      currentAudio = new Audio('sfx/' + soundFile);
      currentAudio.play().catch(e => console.log('SFX file missing locally'));
    }
  </script>
</body>
</html>
